<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#b9a7e6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mértékegység-kaland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f2; --card:#fff; --ink:#3b3450; --soft:#8a83a0; --line:#ece6f5;
  --h:#5b9bd5; --hl:#e3effa; --t:#ef9a4a; --tl:#fdeedd; --u:#3fb0a6; --ul:#ddf3f1; --x:#9b86d9; --xl:#efeafb;
  --ok:#43a861; --okl:#e3f5e8; --bad:#e2606b; --badl:#fde8ea; --star:#f6b93b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:600}
button{font-family:inherit;font-weight:800;color:inherit;cursor:pointer;border:none;background:none}
#app{max-width:540px;margin:0 auto;padding:14px 14px 40px;min-height:100vh}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h1{font-size:24px;font-weight:900;margin:0;flex:1;line-height:1.1}
.top h2{font-size:20px;font-weight:900;margin:0;flex:1}
.pill{background:#fff;border-radius:99px;padding:6px 12px;font-weight:900;box-shadow:0 2px 0 var(--line);white-space:nowrap}
.icon-btn{width:42px;height:42px;border-radius:14px;background:#fff;box-shadow:0 2px 0 var(--line);font-size:20px;display:grid;place-items:center;flex:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border-radius:22px;padding:14px 12px;text-align:left;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:6px;min-height:140px;transition:transform .1s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile .em{font-size:34px}
.tile b{font-size:18px;font-weight:900}
.tile span{font-size:13px;color:var(--soft);line-height:1.3}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;gap:12px}
.tile.wide .pic{width:76px;height:76px;flex:none}
.hello{background:linear-gradient(135deg,#efeafb,#e3effa);border-radius:22px;padding:14px 16px;margin-bottom:14px;display:flex;gap:10px;align-items:center}
.hello .pic{width:80px;height:80px;flex:none}
.hello p{margin:0;font-size:15px;line-height:1.4}
.cats{display:grid;gap:12px}
.cat{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:12px 16px;box-shadow:0 4px 0 var(--line);text-align:left}
.cat .pic{width:70px;height:70px;flex:none}
.cat b{font-size:20px;font-weight:900;display:block}
.cat span{font-size:14px;color:var(--soft)}
.cat[disabled]{opacity:.4}
.qcard{background:#fff;border-radius:24px;padding:16px;box-shadow:0 4px 0 var(--line);text-align:center;position:relative}
.qcard .pic.big{width:150px;height:150px}
.qtext{font-size:21px;font-weight:900;margin:6px 0 2px;line-height:1.3;padding:0 40px}
.qeq{font-size:30px;font-weight:900;margin:10px 0 4px;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.slot{display:inline-block;min-width:84px;padding:2px 12px;border-radius:14px;background:var(--xl);border:3px dashed var(--x);color:var(--x)}
.slot.ok{background:var(--okl);border:3px solid var(--ok);color:var(--ok)}
.slot.show{border-style:solid}
.say{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:12px;background:var(--xl);font-size:20px}
.progress{display:flex;gap:5px;flex:1}
.progress i{flex:1;height:10px;border-radius:9px;background:#e7e1f1}
.progress i.ok{background:var(--ok)}
.progress i.half{background:var(--star)}
.progress i.no{background:#d9d3e4}
.progress i.cur{background:var(--x)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.pad button{background:#fff;border-radius:18px;font-size:28px;padding:12px 0;box-shadow:0 4px 0 var(--line)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad .go{background:var(--x);color:#fff;box-shadow:0 4px 0 #7b66bb}
.pad .del{font-size:24px;color:var(--soft)}
.choices{display:grid;gap:10px;margin-top:14px}
.choices.two{grid-template-columns:1fr 1fr}
.choice{background:#fff;border-radius:18px;font-size:24px;padding:16px 10px;box-shadow:0 4px 0 var(--line);border:3px solid transparent}
.choice:active{transform:translateY(3px)}
.choice.bad{background:var(--badl);border-color:var(--bad);color:var(--bad)}
.choice.ok{background:var(--okl);border-color:var(--ok);color:var(--ok)}
.choice.eq{grid-column:1/-1;font-size:19px;padding:12px}
.cmpbox{font-size:34px;padding:26px 6px}
.fb{margin-top:14px;border-radius:20px;padding:12px 14px;font-size:17px;line-height:1.45}
.fb.ok{background:var(--okl)}
.fb.try{background:#fff6dc}
.fb.show{background:var(--xl)}
.fb .head{font-weight:900;font-size:20px;margin-bottom:2px}
.help{margin-top:12px;background:#fff;border-radius:20px;padding:12px;box-shadow:0 3px 0 var(--line);font-size:16px;line-height:1.5;text-align:center}
.help svg{max-width:100%;height:auto;display:block;margin:6px auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.chips span{background:var(--xl);border-radius:10px;padding:3px 9px;font-weight:900}
.next{display:block;width:100%;margin-top:14px;background:var(--ok);color:#fff;border-radius:20px;font-size:22px;padding:15px;box-shadow:0 4px 0 #2f8549}
.next:active{transform:translateY(3px);box-shadow:0 1px 0 #2f8549}
.big-btn{display:block;width:100%;margin-top:12px;background:var(--x);color:#fff;border-radius:20px;font-size:20px;padding:14px;box-shadow:0 4px 0 #7b66bb}
.big-btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.result{text-align:center;padding-top:20px}
.result .stars{font-size:46px;letter-spacing:4px;margin:10px 0}
.result h2{font-size:28px;margin:6px 0}
.result p{font-size:18px;color:var(--soft)}
/* tanuló kártyák */
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding-bottom:8px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.lcard{flex:0 0 100%;min-width:0;scroll-snap-align:center;background:#fff;border-radius:24px;padding:18px 16px;box-shadow:0 4px 0 var(--line);text-align:center;position:relative}
.lcard .pic{width:170px;height:170px}
.lcard .u{font-size:46px;font-weight:900;line-height:1}
.lcard .n{font-size:20px;color:var(--soft);margin-bottom:8px}
.lcard p{font-size:18px;line-height:1.45;margin:8px 0}
.lcard .rel{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.lcard .rel span{background:var(--xl);border-radius:12px;padding:5px 10px;font-weight:900;font-size:17px}
.navrow{display:flex;gap:10px;align-items:center;margin-top:12px}
.navrow button{flex:1;background:#fff;border-radius:16px;padding:12px;font-size:18px;box-shadow:0 3px 0 var(--line)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:9px;height:9px;border-radius:9px;background:#ddd5ea}
.dots i.on{background:var(--x);width:22px}
/* beállítások */
.set{background:#fff;border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 3px 0 var(--line)}
.set h3{margin:0 0 8px;font-size:17px;font-weight:900}
.set p{margin:4px 0 8px;color:var(--soft);font-size:14px;line-height:1.4}
.ubtns{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.ubtns button,.seg button{border-radius:12px;padding:8px 12px;font-size:16px;background:#f1edf7;color:var(--soft)}
.ubtns button.on,.seg button.on{background:var(--x);color:#fff}
.seg{display:flex;gap:7px;flex-wrap:wrap}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:16px}
.tog button{width:54px;height:32px;border-radius:99px;background:#ddd5ea;position:relative;flex:none}
.tog button::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tog button.on{background:var(--ok)}
.tog button.on::after{left:26px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.modal{position:fixed;inset:0;background:rgba(40,30,60,.35);display:grid;place-items:center;z-index:10;padding:20px}
.modal div{background:#fff;border-radius:22px;padding:18px;max-width:340px;text-align:center}
.modal p{font-size:18px}
.modal .row{display:flex;gap:10px}
.modal .row button{flex:1;border-radius:14px;padding:12px;font-size:17px;background:#f1edf7}
.modal .row button.dang{background:var(--bad);color:#fff}
.tpaper{background:#fff;border-radius:22px;padding:14px 8px;box-shadow:0 4px 0 var(--line);background-image:linear-gradient(#eef2f8 1px,transparent 1px),linear-gradient(90deg,#eef2f8 1px,transparent 1px);background-size:18px 18px}
.tname{display:flex;align-items:center;gap:8px;justify-content:flex-end;font-size:15px;color:var(--soft)}
.tname input{border:none;border-bottom:2px solid var(--line);background:transparent;font:inherit;font-size:17px;color:var(--ink);width:150px;padding:2px 4px}
.tsec h3{font-size:19px;font-weight:900;margin:14px 0 4px}
.tsec .tip{font-size:13px;color:var(--soft);margin:0 0 8px;line-height:1.35}
.trow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px;padding:8px 0;border-bottom:1px dashed var(--line)}
.trow.ok{background:rgba(67,168,97,.07)}.trow.bad{background:rgba(226,96,107,.07)}
.tn{font-weight:900;color:var(--soft);width:20px;padding-bottom:6px;font-size:14px}
.texp{display:flex;flex-wrap:wrap;align-items:flex-end;gap:3px;flex:1;font-size:20px;font-weight:900}
.qt{display:inline-flex;flex-direction:column;align-items:center}
.qv{padding:0 2px 4px;white-space:nowrap}
.scr{display:flex;gap:2px;margin-bottom:2px}
.scr input{width:38px;font:inherit;font-size:13px;padding:2px 3px;border:1.5px dashed #c9c2d8;border-radius:7px;background:#faf8ff;color:#7a7390;text-align:right}
.scr select{font:inherit;font-size:12px;border:1.5px dashed #c9c2d8;border-radius:7px;background:#faf8ff;color:#7a7390;padding:1px 0;max-width:46px}
.op{padding:0 2px 4px}
.bl{display:inline-flex;align-items:flex-end;gap:3px;padding-bottom:2px}
.ans{width:62px;font:inherit;font-size:20px;font-weight:900;text-align:center;border:none;border-bottom:3px solid var(--x);background:var(--xl);border-radius:8px 8px 0 0;padding:3px 2px;color:var(--ink)}
.ans.ok{border-color:var(--ok);background:var(--okl);color:var(--ok)}.ans.bad{border-color:var(--bad);background:var(--badl);color:var(--bad);text-decoration:line-through}
.bu{padding-bottom:4px}
.tfix{width:100%;font-size:14.5px;line-height:1.45;padding:2px 0 2px 30px;color:#3b3450}
.ogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ohead{font-size:13px;font-weight:900;color:var(--soft);text-align:center;margin-bottom:4px}
.oitem{display:flex;flex-direction:column;align-items:center;margin-bottom:8px}
.oitem button{width:100%;background:#fff;border:2.5px solid var(--x);border-radius:14px;padding:9px 4px;font-size:17px;box-shadow:0 3px 0 var(--line)}
.oitem.used button{opacity:.3;border-style:dashed}
.oslot{display:flex;align-items:center;gap:6px;width:100%;min-height:44px;margin-bottom:8px;background:#faf8ff;border:2px dashed #c9c2d8;border-radius:14px;padding:6px 8px;font-size:17px;text-align:left}
.oslot span{color:var(--soft);font-size:14px}
.oslot.ok{background:var(--okl);border:2px solid var(--ok)}.oslot.bad{background:var(--badl);border:2px solid var(--bad)}
.ogrid>div:last-child{padding-top:22px}
.tgrade{display:flex;align-items:center;gap:14px;background:var(--xl);border-radius:16px;padding:10px 14px;margin:8px 0;font-size:17px}
.jegy{font-family:'Comic Sans MS',cursive;font-size:52px;font-weight:900;color:#e2606b;line-height:1;width:56px;text-align:center;border:3px solid #e2606b;border-radius:50%;height:62px;display:grid;place-items:center}
.mrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:6px 0}
.pult{min-height:86px;background:#f3ead9;border:3px dashed #d4bf98;border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin-top:10px}
.pult button{padding:0;line-height:0}
.pult .empty{color:#a8916a;font-size:15px}
.kassza{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;justify-items:center}
.kassza.coins{grid-template-columns:repeat(6,1fr)}
.kassza button{padding:2px;line-height:0;border-radius:10px}
.kassza button:active{transform:scale(.92)}
.amount{font-size:38px;font-weight:900;margin:4px 0}
.pvt{border-collapse:collapse;margin:8px auto;font-size:15px}
.pvt th{font-size:12px;padding:3px 6px;border-bottom:2px solid var(--line)}
.pvt td{padding:4px 8px;font-weight:900;font-size:20px;text-align:center;border-left:1px dashed var(--line)}
.pvt td:first-child{font-size:13px;color:var(--soft);border-left:none;text-align:right}
.dien{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:center;margin:8px 0}
.dgrp{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-end;max-width:100%}
.bctl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.bctl>div{background:#fff;border-radius:16px;padding:8px 4px;text-align:center;box-shadow:0 3px 0 var(--line)}
.bctl b{display:block;font-size:13px}
.bctl .n{font-size:26px;font-weight:900}
.bctl button{width:32px;height:34px;border-radius:10px;font-size:22px;background:#f1edf7;margin:2px}
.okbtn{display:block;width:100%;margin-top:12px;background:var(--x);color:#fff;border-radius:18px;font-size:20px;padding:13px;box-shadow:0 4px 0 #7b66bb}
.stackwrap{display:flex;justify-content:center;margin:10px 0;min-height:60px;align-items:center}
.stack{position:relative;height:1.35em;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:900}
.scard{position:absolute;right:0;top:0;background:#fff;border:2.5px solid;border-radius:8px;padding:0 6px 0 1px;line-height:1.25;box-shadow:0 2px 4px rgba(0,0,0,.12)}
.crow{display:flex;align-items:center;gap:4px;margin-top:6px}
.crow .lab{width:56px;font-size:11px;font-weight:900;text-align:right;flex:none}
.cgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;flex:1}
.cgrid button{background:#fff;border:2px solid #e6e0ef;border-radius:7px;padding:6px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:900}
.cgrid button.on{color:#fff}
.bignum{font-size:42px;font-weight:900;letter-spacing:2px;margin:6px 0}
.rbot{display:flex;align-items:center;gap:6px;background:#fff;border-radius:14px;padding:8px 12px;box-shadow:0 2px 0 var(--line);font-size:16px}
.rbar{height:10px;background:#ece6f5;border-radius:9px;overflow:hidden;margin:6px 0}
.rbar i{display:block;height:100%;border-radius:9px;transition:width .4s}
.cserebtn{width:auto!important;padding:0 8px;background:var(--star)!important;color:#fff;animation:pop .6s infinite alternate}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* Berta – beépített Piper felolvasó (háttérszálon fut: tts/berta-worker.js) */
const BERTA={state:'off',pct:0,err:'',ctx:null,cache:new Map(),token:0,src:null,w:null,sr:22050,jobs:new Map(),nid:1};
async function bertaLoad(base='tts/',onProgress=()=>{}){
  if(BERTA.state==='ready'||BERTA.state==='loading')return BERTA.wait;
  BERTA.state='loading';BERTA.pct=0;
  BERTA.wait=new Promise(done=>{try{
    const w=new Worker(base+'berta-worker.js');BERTA.w=w;
    w.onmessage=e=>{const m=e.data;
      if(m.t==='prog'){BERTA.pct=m.p;onProgress(m.p);}
      else if(m.t==='ready'){BERTA.sr=m.sr;BERTA.state='ready';BERTA.pct=100;onProgress(100);done();}
      else if(m.t==='err'){BERTA.state='error';BERTA.err=m.e;onProgress(0);done();}
      else if(m.t==='pcm'){const j=BERTA.jobs.get(m.id);if(j){BERTA.jobs.delete(m.id);m.err?j.no(new Error(m.err)):j.ok(m.pcm);}}};
    w.onerror=e=>{BERTA.state='error';BERTA.err=(e&&e.message)||'worker';onProgress(0);done();};
    w.postMessage({t:'load',base:new URL(base,location.href).href});
  }catch(e){BERTA.state='error';BERTA.err=String(e&&e.message||e);onProgress(0);done();}});
  return BERTA.wait;
}
function bertaSynth(text,rate=1){
  const key=rate+'|'+text;if(BERTA.cache.has(key))return BERTA.cache.get(key);
  const id=BERTA.nid++;const pr=new Promise((ok,no)=>{BERTA.jobs.set(id,{ok,no});BERTA.w.postMessage({t:'synth',id,text,rate});});
  pr.catch(()=>BERTA.cache.delete(key));
  if(BERTA.cache.size>150)BERTA.cache.delete(BERTA.cache.keys().next().value);
  BERTA.cache.set(key,pr);return pr;
}
function bertaCtx(){if(!BERTA.ctx){const C=window.AudioContext||window.webkitAudioContext;BERTA.ctx=new C();}if(BERTA.ctx.state==='suspended')BERTA.ctx.resume().catch(()=>{});return BERTA.ctx;}
function bertaStop(){BERTA.token++;if(BERTA.w){BERTA.w.postMessage({t:'cancel',before:BERTA.nid});for(const [id,j] of BERTA.jobs){j.no(new Error('cancel'));}BERTA.jobs.clear();}try{BERTA.src&&BERTA.src.stop();}catch(e){}BERTA.src=null;}
async function bertaSay(text,rate=1){
  bertaStop();const tk=BERTA.token,ctx=bertaCtx();
  const parts=[];text.split(/(?<=[.!?…])\s+/).map(s=>s.trim()).filter(Boolean).forEach(p=>{if(p.length>60&&p.includes(', ')){const q=p.split(/(?<=,)\s+/);let cur='';q.forEach(x=>{if((cur+' '+x).length>45&&cur){parts.push(cur);cur=x;}else cur=cur?cur+' '+x:x;});if(cur)parts.push(cur);}else parts.push(p);});
  const jobs=parts.map(()=>null);let next=0;
  const get=i=>jobs[i]||(jobs[i]=bertaSynth(parts[i],rate));
  for(let i=0;i<parts.length;i++){
    let pcm;try{pcm=await get(i);}catch(e){if(tk!==BERTA.token)return;throw e;}if(tk!==BERTA.token)return;
    if(i+1<parts.length)get(i+1);
    const buf=ctx.createBuffer(1,pcm.length,BERTA.sr);buf.copyToChannel(pcm,0);
    await new Promise(res=>{const s=ctx.createBufferSource();s.buffer=buf;s.connect(ctx.destination);s.onended=res;BERTA.src=s;s.start();});
    if(tk!==BERTA.token)return;
    await new Promise(r=>setTimeout(r,140));
  }
}

/* ============ RAJZOK (120×120 viewBox) ============ */
const spoon = (x,y,rot,liq,sc=1)=>`<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sc})"><rect x="-3.5" y="12" width="7" height="48" rx="3.5" fill="#b9bfcc"/><ellipse rx="14" ry="18" fill="#c9ced9"/><ellipse rx="10.5" ry="14" fill="${liq}"/><ellipse cx="-4" cy="-5" rx="3" ry="5" fill="#fff" opacity=".6"/></g>`;

function stairs(cat,hl=[]){
  const us=allUnitsOf(cat),C=CATS[cat],bw=56,bh=34,dx=64,dy=30;
  const W=8+us.length*dx+14,H=8+(us.length-1)*dy+bh+4;let s='';
  us.forEach((u,i)=>{const x=6+i*dx,y=6+i*dy,h=hl.includes(u),act=on(u);
    if(i<us.length-1){const r=U[u].f/U[us[i+1]].f,cx=x+dx+bw/2;
      s+=`<path d="M${x+bw} ${y+bh/2} H${cx} V${y+dy-3}" stroke="${C.hex}" stroke-width="2.5" fill="none"/><polygon points="${cx-5},${y+dy-8} ${cx+5},${y+dy-8} ${cx},${y+dy-1}" fill="${C.hex}"/><text x="${cx+4}" y="${y+12}" font-size="13" font-weight="900" fill="${C.hex}">×${fmt(r)}</text>`;}
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="9" fill="${h?C.hex:(act?'#fff':'#f1eef5')}" stroke="${act||h?C.hex:'#d8d2e2'}" stroke-width="2.5"/><text x="${x+bw/2}" y="${y+23}" text-anchor="middle" font-size="18" font-weight="900" fill="${h?'#fff':(act?'#3b3450':'#b7b0c4')}">${u}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:100%">${s}</svg>`;
}
function blocks(big,small,count){
  const r=U[big].f/U[small].f,C=CATS[U[big].c],bh=34,gap=10,shown=Math.min(count,5);
  const H=shown*(bh+gap)+(count>5?22:0);let s='';const cw=316/10;
  for(let i=0;i<shown;i++){const y=i*(bh+gap)+2;
    s+=`<rect x="2" y="${y}" width="316" height="${bh}" rx="8" fill="${C.lhex}" stroke="${C.hex}" stroke-width="2.5"/>`;
    for(let j=1;j<10;j++)s+=`<line x1="${2+j*cw}" y1="${y}" x2="${2+j*cw}" y2="${y+bh}" stroke="${C.hex}" stroke-width="1.3"/>`;
    for(let j=0;j<10;j++)s+=`<text x="${2+j*cw+cw/2}" y="${y+22}" text-anchor="middle" font-size="${r/10>=1000?9:12}" font-weight="900" fill="#3b3450">${fmt(r/10)}</text>`;}
  if(count>5)s+=`<text x="160" y="${H-4}" text-anchor="middle" font-size="14" font-weight="900" fill="${C.hex}">… és így tovább, összesen ${count} csík</text>`;
  return `<svg viewBox="0 0 320 ${H}" width="320">${s}</svg>`;
}
function bars(a,b,small,cat){
  const C=CATS[cat],mx=Math.max(a.v,b.v),w=v=>Math.max(14,Math.round(250*v/mx));
  const row=(o,y)=>`<rect x="2" y="${y}" width="${w(o.v)}" height="26" rx="7" fill="${C.hex}" opacity="${o.v===mx?1:.55}"/><text x="${w(o.v)+8}" y="${y+19}" font-size="15" font-weight="900" fill="#3b3450">${fmt(o.v)} ${small}</text>`;
  return `<svg viewBox="0 0 340 70" width="340">${row(a,4)}${row(b,40)}</svg>`;
}

function dAdd(cats,sub){

function dOrder(cats){

function botTurn(){if(G.winner||view.s!=='race')return;G.showPv=false;
  const d=rollDice();addRoll(G.bot,d);let ex;while((ex=needEx(G.bot,G.target)).length){G.bot[ex[0]]-=10;G.bot[ex[0]*10]++;}
  G.botDice=d;
  if(gTot(G.bot)>=G.target){G.winner='bot';G.msg=`Robi elérte ${G.target===100?'a 100-at':'az 1000-et'}. Most ő nyert. Próbáld újra!`;render();say('Most Robi nyert. Próbáld újra!');return;}
  G.turn='me';G.phase='roll';G.msg='Te jössz! Dobj!';render();}
function raceV(){
  if(!G)return '';const t=G.target,pl=[1000,100,10,1].filter(p=>p<=t);const me=gTot(G.me),bo=gTot(G.bot);
  const bar=(v,c)=>`<div class="rbar"><i style="width:${Math.min(100,100*v/t)}%;background:${c}"></i></div>`;
  return `<div class="top"><button class="icon-btn" onclick="go('money')">✕</button><h2>🎲 Csere-bere ${t}-ig</h2><span class="pill">⭐ ${S.stars}</span></div>
  <div class="rbot">🤖 <b>Robi</b> ${G.botDice?`<span style="color:var(--soft);font-size:13px">(dobott: ${G.botDice.join(' és ')})</span>`:''}<span style="flex:1"></span>${pl.map(p=>`<span style="color:${PVC[p]};font-weight:900">${G.bot[p]}</span>`).join(' ')}</div>${bar(bo,'#b9a7e6')}
  <div class="qcard" style="margin-top:10px;border-top:8px solid var(--star);padding:12px 8px">
   <div style="font-weight:900">Te ${G.showPv||G.winner?`– ${me}`:''}</div>${bar(me,'var(--star)')}
   ${blocksHtml(G.me)}
   <div class="bctl" style="grid-template-columns:repeat(${pl.length},1fr)">${pl.map(p=>`<div><b style="color:${PVC[p]}">${BLKN[p]}</b><div class="n" style="color:${PVC[p]}">${G.me[p]}</div>${p<t&&G.me[p]>=10&&G.phase==='exchange'?`<button class="cserebtn" onclick="doEx(${p})">Csere! ↑</button>`:''}</div>`).join('')}</div>
   ${G.showPv?pvTable([{l:'Neked',n:me}],t):''}
  </div>
  <div class="fb ${G.winner==='me'?'ok':G.phase==='exchange'?'try':'show'}" style="text-align:center">${G.dice&&G.turn==='me'&&G.phase!=='roll'?`<div class="mrow">${G.dice.map(DIE).join('')}</div>`:''}${G.msg}</div>
  ${G.phase==='ask'?`<div class="qeq"><span class="slot">${G.inp||'?'}</span></div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button onclick="askKey('${d}')">${d}</button>`).join('')}<button class="del" onclick="askKey('del')">⌫</button><button onclick="askKey('0')">0</button><button class="go" onclick="askKey('ok')">✓</button></div>`:''}
  ${G.winner?`<button class="big-btn" onclick="newRace(${t})">Új verseny 🎲</button>`:G.phase==='roll'?`<button class="okbtn" onclick="rollMe()">Dobok! 🎲</button>`:G.turn==='bot'?`<div style="text-align:center;color:var(--soft);margin-top:10px">Robi dob…</div>`:''}
  <p style="color:var(--soft);font-size:13px;margin-top:14px">${t>100?'Az egyik kocka rudakat (tízeseket), a másik kis kockákat (egyeseket) ad.':'A két kocka összegével annyi kis kockát kapsz.'} Ha valamiből 10 összegyűlt, be kell cserélni 1 nagyobbra. Minden harmadik körben megkérdezem, mennyi kockád van.</p>`;
}

/* --- Ismerd meg --- */
function learnCards(cat){
  const C=CATS[cat],cards=[];
  cards.push({pic:C.ic,u:C.n,n:'',p:`Azt mutatja meg, <b>${C.what}</b>. ${C.tool}`,p2:C.extra,extraPics:cat==='t'?['lufi','kavics']:null,say:`${C.n}. Azt mutatja meg, ${C.what}. ${C.tool} ${C.extra}`});
  allUnitsOf(cat).slice().reverse().filter(on).forEach(u=>{
    const rel=allUnitsOf(cat).filter(v=>U[v].f<U[u].f&&on(v)&&U[u].f/U[v].f<=1000).map(v=>`1 ${u} = ${fmt(U[u].f/U[v].f)} ${v}`);
    cards.push({pic:U[u].pic,u:`1 ${u}`,n:U[u].n,p:U[u].tip,rel,say:`1 ${U[u].n}. ${U[u].tip} ${rel.join('. ')}`});});
  const pre={h:'A <b>kilo</b> ezret jelent: 1 km = 1000 m. A <b>centi</b>ből 100 darab kell egy méterhez, a <b>milli</b>ből 1000 darab.',t:'A <b>kilo</b> ezret jelent: 1 kg = 1000 g. A <b>deka</b> tízet jelent: 1 dkg = 10 g.',u:'A <b>deci</b>ből 10 darab kell egy literhez, a <b>centi</b>ből 100, a <b>milli</b>ből 1000. A <b>hekto</b> százat jelent: 1 hl = 100 l.'}[cat];
  cards.push({stairs:true,u:'Az egységlépcső',n:'',p:`Ha lefelé lépsz a lépcsőn, az egység <b>kisebb</b> lesz, ezért <b>több darab</b> kell belőle. Ha felfelé lépsz, kevesebb.`,p2:pre,say:`Az egységlépcső. Ha lefelé lépsz a lépcsőn, az egység kisebb lesz, ezért több darab kell belőle. ${pre}`});
  return cards;
}

let carIdx=0;
function initCarousel(){carIdx=0;const c=$('#car');if(!c)return;c.addEventListener('scroll',()=>{const i=Math.round(c.scrollLeft/c.clientWidth);if(i!==carIdx){carIdx=i;document.querySelectorAll('#dots i').forEach((d,j)=>d.className=j===i?'on':'');}},{passive:true});}
function carMove(d){const c=$('#car');const n=c.children.length;const i=Math.max(0,Math.min(n-1,carIdx+d));c.children[i].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});}
function sayCard(i){say(learnCards(view.cat)[i].say,true);}

/* --- Gyakorlás --- */
function newRound(act,cats){R={act,cats,n:S.set.len,i:0,score:0,res:[],seen:new Set()};view={s:'quiz'};nextQ();}
function gen(){const g={conv:genConv,cmp:genCmp,unit:genUnit,ruler:genRuler,pay:genPay,count:genCount,build:genBuild,decomp:genDecomp,groups:genGroups}[R.act];let q;for(let t=0;t<25;t++){q=g(R.cats);if(!R.seen.has(q.key))break;}R.seen.add(q.key);return q;}
function nextQ(){if(R.i>=R.n){finish();return;}R.q=gen();R.tries=0;R.done=false;R.inp='';R.fb=null;R.wrong=[];R.pay=[];R.bld={1000:0,100:0,10:0,1:0};R.cards={};render();setTimeout(()=>say(R.q.say),250);}
function quizV(){
  const q=R.q,C=CATS[q.cat]||{col:'var(--star)'};
  const prog=[...Array(R.n)].map((_,i)=>`<i class="${i<R.i?(R.res[i]===2?'ok':R.res[i]===1?'half':'no'):i===R.i?'cur':''}"></i>`).join('');
  const slotCls=R.done?(R.fb&&R.fb.type==='ok'?'ok':'show'):'';
  const slot=`<span class="slot ${slotCls}" id="slot">${R.done&&R.fb.type==='show'?fmt(q.ans):(R.inp?fmt(+R.inp):'?')}</span>`;
  let body='';
  if(q.kind==='conv')body=`<div style="font-size:16px;color:var(--soft)">Váltsd át!</div><div class="qeq">${q.eq.replace('SLOT',slot)}</div>`;
  if(q.kind==='ruler')body=`<div class="qtext">${q.q}</div><div style="margin:8px -6px 0">${scaleSVG(q,R.done)}</div><div style="font-size:14px;color:var(--soft)">${SC[q.sc].legend}</div><div class="qeq">${q.eq.replace('SLOT',slot)}</div>`;
  if(q.kind==='unit')body=`${pic(q.pic,'big')}<div class="qtext">${q.q}</div>`;
  if(q.kind==='pay'){const sum=R.pay.reduce((a,b)=>a+b,0);body=`<div class="qtext">Fizesd ki pontosan!</div><div class="amount">${fmt(q.ans)} Ft</div>
    <div class="pult">${R.pay.length?R.pay.slice().map((d,i)=>[d,i]).sort((a,b)=>b[0]-a[0]).map(([d,i])=>`<button onclick="payDel(${i})" aria-label="${d} Ft levétele">${moneySVG(d,.72)}</button>`).join(''):'<span class="empty">A pult üres. Koppints lent a pénzre!</span>'}</div>
    ${R.done||R.showSum?`<div style="margin-top:6px;color:var(--soft)">A pulton: <b>${fmt(sum)} Ft</b></div>`:`<button style="margin-top:6px;color:var(--soft);font-size:14px;text-decoration:underline" onclick="R.showSum=1;render();setTimeout(()=>R.showSum=0,0)">Mennyi van a pulton?</button>`}`;}
  if(q.kind==='count')body=`<div class="qtext">Mennyi pénz van itt?</div><div class="mrow">${q.pcs.map(d=>moneySVG(d,d>=500?.85:1.15)).join('')}</div><div class="qeq">${q.eq.replace('SLOT',slot)}</div>`;
  if(q.kind==='build')body=`<div class="qtext">Rakd ki ezt a számot!</div><div class="amount">${fmt(q.ans)}</div>${blocksHtml(R.bld)}`;
  if(q.kind==='cards')body=`<div class="qtext">Rakd ki kártyákból!</div><div class="bignum">${fmt(q.ans)}</div>${stackHtml(R.cards,true)}`;
  if(q.kind==='expand')body=`<div class="qtext">Melyik szám ez?</div><div class="qeq">${q.eq.replace('SLOT',slot)}</div>`;
  if(q.kind==='val')body=`<div class="bignum">${q.num}</div><div class="qtext">${q.q}</div>`;
  if(q.kind==='groups')body=`<div class="qtext">Mennyi?</div><div class="qeq">${q.eq.replace('SLOT',slot)}</div>${q.blk?blocksHtml(q.blk):''}`;
  if(q.kind==='read')body=`<div class="qtext">Melyik számot raktuk ki?</div>${blocksHtml(q.cnt)}<div class="qeq">${q.eq.replace('SLOT',slot)}</div>`;
  if(q.kind==='cmp')body=`<div class="qtext">Melyik a több?</div><div style="font-size:15px;color:var(--soft)">Koppints arra, amelyik több!</div>`;
  let input='';
  if(q.input==='num'&&!R.done)input=`<div class="pad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button onclick="key('${d}')">${d}</button>`).join('')}<button class="del" onclick="key('del')">⌫</button><button onclick="key('0')">0</button><button class="go" onclick="key('ok')">✓</button></div>`;
  if(q.input==='choice')input=`<div class="choices ${q.choices.length===4?'two':''}">${q.choices.map((c,i)=>`<button class="choice ${R.done&&c===q.ans?'ok':R.wrong.includes(c)?'bad':''}" ${R.done||R.wrong.includes(c)?'disabled':''} onclick="choose(${i})">${c}</button>`).join('')}</div>`;
  if(q.input==='cmp'){const cl=v=>R.done&&q.ans===v?'ok':R.wrong.includes(v)?'bad':'';const dis=v=>R.done||R.wrong.includes(v)?'disabled':'';
    input=`<div class="choices two"><button class="choice cmpbox ${cl('L')}" ${dis('L')} onclick="choose('L')">${q.L.t}</button><button class="choice cmpbox ${cl('R')}" ${dis('R')} onclick="choose('R')">${q.R.t}</button><button class="choice eq ${cl('E')}" ${dis('E')} onclick="choose('E')">🟰 Egyformák</button></div>`;}
  if(q.input==='pay'&&!R.done){const ds=denomsOK();input=`<div class="kassza">${ds.filter(d=>d>=500).reverse().map(d=>`<button onclick="payAdd(${d})" aria-label="${d} Ft">${moneySVG(d,1)}</button>`).join('')}</div><div class="kassza coins">${ds.filter(d=>d<500).reverse().map(d=>`<button onclick="payAdd(${d})" aria-label="${d} Ft">${moneySVG(d,1.05)}</button>`).join('')}</div><button class="okbtn" onclick="if(R.pay.length)answer(R.pay.reduce((a,b)=>a+b,0))">Kifizetem ✓</button>`;}
  if(q.input==='cards'&&!R.done)input=`${q.pl.map(p=>`<div class="crow"><span class="lab" style="color:${PVC[p]}">${PVPL[p]}</span><div class="cgrid">${[1,2,3,4,5,6,7,8,9].map(k=>`<button class="${R.cards[p]===k?'on':''}" style="${R.cards[p]===k?`background:${PVC[p]};border-color:${PVC[p]}`:`color:${PVC[p]}`};${p>=1000?'font-size:10.5px':''}" onclick="cPick(${p},${k})">${k*p}</button>`).join('')}</div></div>`).join('')}<button class="okbtn" onclick="answer(Object.keys(R.cards).reduce((a,p)=>a+R.cards[p]*p,0))">Kész ✓</button>`;
  if(q.input==='build'&&!R.done)input=`<div class="bctl">${[1000,100,10,1].filter(p=>p<=q.ans).map(p=>`<div><b style="color:${PVC[p]}">${BLKN[p]}</b><span style="font-size:12px;color:var(--soft)">${PVN[p]}</span><div class="n" style="color:${PVC[p]}">${R.bld[p]}</div><button onclick="bAdd(${p},-1)">−</button><button onclick="bAdd(${p},1)">+</button></div>`).join('')}</div><button class="okbtn" onclick="answer(R.bld[1000]*1000+R.bld[100]*100+R.bld[10]*10+R.bld[1])">Kész ✓</button>`;
  const fb=R.fb?`<div class="fb ${R.fb.type} pop"><div class="head">${R.fb.head}</div>${R.fb.msg}</div>`:'';
  const helpHtml=(R.tries>0||R.done)?q.help(R.done):'';
  const help=helpHtml?`<div class="help">${helpHtml}</div>`:'';
  return `<div class="top"><button class="icon-btn" onclick="go('home')" aria-label="Kilépés">✕</button><div class="progress">${prog}</div><span class="pill">⭐ ${S.stars}</span></div>
  <div class="qcard ${R.anim||''}" style="border-top:8px solid ${C.col}"><button class="say" onclick="say(R.q.say,true)" aria-label="Felolvasás">🔊</button>${body}</div>
  ${input}${fb}${help}${R.done?`<button class="next" onclick="R.i++;nextQ()">${R.i+1>=R.n?'Eredmény 🏁':'Tovább →'}</button>`:''}`;
}
function key(k){if(R.done)return;if(k==='del')R.inp=R.inp.slice(0,-1);else if(k==='ok'){if(R.inp!=='')answer(+R.inp);return;}else if(R.inp.length<6&&!(R.inp===''&&k==='0'))R.inp+=k;
  const s=$('#slot');if(s){s.textContent=R.inp?fmt(+R.inp):'?';s.className='slot';}}
function choose(v){const q=R.q;if(q.input==='choice')v=q.choices[v];answer(v);}
function answer(v){
  const q=R.q;R.anim='';
  if(v===q.ans){R.done=true;const first=R.tries===0;if(first){R.score++;S.stars++;}R.res[R.i]=first?2:1;
    const pr=pick(PRAISE).replace('!','');R.fb={type:'ok',head:first?`${pr}, jutalmad 1 csillag! ⭐`:pr+'!',msg:(first?'':'Második próbálkozásra sikerült! ')+(q.okMsg?q.okMsg():'')};save();if(first)confetti();say(first?`${pr}, jutalmad 1 csillag!`:`${pr}! Második próbálkozásra sikerült!`);}
  else{R.tries++;if(q.input==='choice'||q.input==='cmp')R.wrong.push(v);
    if(R.tries<2){R.fb={type:'try',head:'Nem baj, próbáld újra! 💪',msg:q.hint(v)};R.inp='';R.anim='shake';say('Próbáld újra! '+q.hint(v));}
    else{R.done=true;R.res[R.i]=0;const a=q.kind==='pay'||q.kind==='count'?`${fmt(q.ans)} Ft`:['build','read','cards','expand','groups'].includes(q.kind)?fmt(q.ans):q.kind==='conv'||q.kind==='ruler'?`${fmt(q.ans)}${q.kind==='ruler'?' '+q.u:''}`:q.kind==='cmp'?(q.ans==='E'?'Egyformák':q.ans==='L'?q.L.t:q.R.t):q.ans;
      R.fb={type:'show',head:'Nézzük meg együtt! 👀',msg:`A helyes válasz: <b>${a}</b>`};}}
  render();
}
function finish(){
  const best=S.best[R.act];if(best==null||R.score>best)S.best[R.act]=R.score;save();view={s:'result'};render();if(R.score>=R.n*.7)confetti();
  say(R.score===R.n?'Hibátlan! Minden kérdésre elsőre jól válaszoltál!':`${R.score} csillagot szereztél!`);
}
function resultV(){
  const p=R.score/R.n,msg=p===1?'Hibátlan! Mértékegység-bajnok vagy! 🏆':p>=.7?'Nagyon ügyes voltál!':p>=.4?'Szép munka! Gyakoroljunk még egy kicsit!':'Jó kezdés! Nézd meg az „Ismerd meg!” kártyákat, aztán próbáld újra!';
  return `<div class="result"><div style="font-size:60px">${p===1?'🏆':p>=.7?'🎉':'💪'}</div><h2>${R.score} / ${R.n}</h2>
  <div class="stars">${'⭐'.repeat(R.score)}${'☆'.repeat(R.n-R.score)}</div><p>${msg}</p>
  <button class="big-btn" onclick="newRound('${R.act}',${JSON.stringify(R.cats).replace(/"/g,"'")})">Újra! 🔁</button>
  <button class="big-btn ghost" onclick="go('home')">Főmenü</button></div>`;
}

/* --- Beállítások --- */
function setV(){
  const st=S.set;const tog=(k,l)=>`<div class="tog"><span>${l}</span><button class="${st[k]?'on':''}" onclick="S.set.${k}=!S.set.${k};save();render()"></button></div>`;
  return `<div class="top"><button class="icon-btn" onclick="go('home')">←</button><h2>Szülőknek ⚙️</h2></div>
  <div class="set"><h3>Mértékegységek</h3><p>Csak a bekapcsolt egységek szerepelnek a feladatokban. 2. osztályban általában m, cm, kg, l, dl; 3. osztályban a többi is.</p>
  ${['h','t','u'].map(c=>`<div class="ubtns">${allUnitsOf(c).slice().reverse().map(u=>`<button class="${on(u)?'on':''}" onclick="S.set.units.${u}=S.set.units.${u}?0:1;save();render()">${u}</button>`).join('')}</div>`).join('')}</div>
  <div class="set"><h3>Számkör</h3><p>A legnagyobb szám, ami egy feladatban előfordulhat.</p><div class="seg">${[100,1000,10000].map(v=>`<button class="${st.limit===v?'on':''}" onclick="S.set.limit=${v};save();render()">${fmt(v)}-ig</button>`).join('')}</div></div>
  <div class="set"><h3>Dolgozat hossza</h3><div class="seg">${[['short','Rövid'],['normal','Normál'],['long','Hosszú']].map(([k,l])=>`<button class="${(st.tlen||'normal')===k?'on':''}" onclick="S.set.tlen='${k}';save();render()">${l}</button>`).join('')}</div></div>
  <div class="set"><h3>Kérdések egy körben</h3><div class="seg">${[5,8,10,15].map(v=>`<button class="${st.len===v?'on':''}" onclick="S.set.len=${v};save();render()">${v}</button>`).join('')}</div></div>
  <div class="set"><h3>Nehézség</h3>
  ${tog('compound','Összetett váltás (pl. 2 m 35 cm = ? cm)')}
  ${tog('shift','Mérés: a tárgy nem mindig a 0-nál kezdődik')}
  </div>
  <div class="set"><h3>Felolvasás 🔊</h3>${tog('voice','Kérdések automatikus felolvasása')}
  <p>Hang:</p><div class="ubtns"><button class="${useBerta()?'on':''}" onclick="S.set.voiceName='berta';save();render();say('Szia! Milyen hosszú egy busz? 12 méter.',true)">Berta (beépített)</button>${voices.map(v=>`<button class="${!useBerta()&&curVoice()===v?'on':''}" onclick='S.set.voiceName=${JSON.stringify(v.name).replace(/'/g,"&#39;")};save();render();say("Szia! Milyen hosszú egy busz? 12 méter.",true)'>${v.name.replace(/Microsoft /,'').replace(/ - Hungarian.*| \(Hungary\)/,'')}</button>`).join('')}</div>
  <p id="bstat">${bertaStatus()}</p>
  ${voices.length?'':`<p>A készülék saját magyar hangját nem találtam. Ez nem baj, Berta enélkül is működik.</p>`}
  <p>Sebesség:</p><div class="seg">${[[0.8,'Lassabb'],[0.95,'Normál'],[1.08,'Gyorsabb']].map(([r,l])=>`<button class="${Math.abs((S.set.rate||0.95)-r)<.01?'on':''}" onclick="S.set.rate=${r};save();render();say('Hány centiméter egy méter?',true)">${l}</button>`).join('')}</div>
  <button class="big-btn ghost" onclick="say('3 méter, az hány centiméter? Ügyes vagy!',true)">▶ Próba</button></div>
  <div class="set"><h3>Csillagok: ${S.stars} ⭐</h3><button class="big-btn ghost" onclick="askReset()">Csillagok nullázása</button></div>`;
}
function askReset(){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div><p>Biztosan nullázod a csillagokat és a legjobb eredményeket?</p><div class="row"><button onclick="this.closest('.modal').remove()">Mégse</button><button class="dang" onclick="S.stars=0;S.best={};save();this.closest('.modal').remove();render()">Nullázás</button></div></div>`;document.body.appendChild(m);}

document.addEventListener('keydown',e=>{if(view.s!=='quiz'||!R||R.done){if(view.s==='quiz'&&R&&R.done&&e.key==='Enter'){R.i++;nextQ();}return;}
  if(R.q.input!=='num')return;if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('del');else if(e.key==='Enter')key('ok');});
render();
setTimeout(startBerta,1500);
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
